f.choose=தேர்ந்தெடுக்கவும்…
f.craft=நீங்கள் என்ன செய்கிறீர்கள் அல்லது விற்கிறீர்கள்?
f.craftExample=எ.கா. கைத்தறி புடவைகள், ஊறுகாய், மண்பாண்டங்கள்
f.message=வேறு ஏதாவது? (விருப்பம்)
f.messageExample=எ.கா. உங்கள் குழுவில் எத்தனை பேர், இப்போது எங்கே விற்கிறீர்கள்
reg.title=உங்கள் கடையைப் பதிவு செய்யுங்கள்
reg.intro=உங்கள் உள்நுழைவையும் கடையையும் உருவாக்குங்கள். அடுத்து புகைப்படங்களையும் பொருட்களையும் சேர்க்கலாம். குழு சரிபார்த்த பிறகு உங்கள் கடை அனைவருக்கும் தெரியும்.
