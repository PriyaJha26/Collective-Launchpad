<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(#{join.title} + ' · ' + ${group.name})}"></head>
<body>
<header th:replace="~{fragments :: topBar}"></header>
<main class="wrap narrow">
  <h1 th:text="#{join.title}">Sell with us</h1>
  <p th:text="#{join.intro}">Intro</p>
  <p class="small"><span th:text="#{join.self}"></span> <a href="/register/seller" th:text="#{join.selfLink}">Register</a></p>

  <div class="alert ok" th:if="${sent}" th:text="#{join.sent}">Thank you!</div>
  <div class="alert err" th:if="${formError}" th:text="${formError}"></div>

  <form method="post" action="/join" class="panel" th:unless="${sent}">
    <label for="name" th:text="#{f.name}">Your name</label>
    <input id="name" name="name" type="text" maxlength="100" required th:value="${form?.name()}">

    <div class="grid2">
      <div><label for="phone" th:text="#{f.phone}">Phone</label><input id="phone" name="phone" type="tel" maxlength="20" th:value="${form?.phone()}"></div>
      <div><label for="email" th:text="#{f.email}">Email</label><input id="email" name="email" type="email" maxlength="200" th:value="${form?.email()}"></div>
    </div>
    <p class="hint" th:text="#{f.contactHint}">Give at least one.</p>

    <div class="grid2">
      <div><label for="location" th:text="#{f.location}">Location</label><input id="location" name="location" type="text" maxlength="120" th:value="${form?.location()}"></div>
    </div>

    <label for="craft" th:text="#{f.craft}">What do you make?</label>
    <input id="craft" name="craft" type="text" maxlength="300" required th:placeholder="#{f.craftExample}" th:value="${form?.craft()}">

    <label for="message" th:text="#{f.message}">Anything else?</label>
    <textarea id="message" name="message" maxlength="4000" th:placeholder="#{f.messageExample}" th:text="${form?.message()}"></textarea>

    <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" type="text" name="website" tabindex="-1" autocomplete="off"></div>
    <p class="mt"><button class="btn big" type="submit" th:text="#{join.submit}">Send</button></p>
  </form>
</main>
<footer class="site"><div class="wrap">
  <span th:text="#{join.questions}">Questions?</span> <a href="/#contact" th:text="#{join.contact}">Contact us</a>
  · <a th:href="'mailto:' + ${group.contactEmail}" th:text="${group.contactEmail}"></a>
</div></footer>
</body>
</html>
