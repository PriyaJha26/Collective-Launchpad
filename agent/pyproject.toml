[project]
name = "launchpad-agent"
version = "0.2.0"
description = "Collective Launchpad agent service: every Claude call lives here"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
