<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in · ' + ${group.name})}"></head>
<body>
<main class="wrap login-box">
  <div class="panel">
    <h1 th:text="${group.name}">Group</h1>
    <p class="muted">Group admin login</p>
    <div class="alert err" th:if="${param.error}">Wrong email or password.</div>
    <div class="alert ok" th:if="${param.logout}">You have logged out.</div>
    <form th:action="@{/login}" method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="mt"><button class="btn" type="submit">Log in</button></p>
    </form>
  </div>
  <p class="center small"><a href="/">← Back to the site</a></p>
</main>
</body>
</html>
