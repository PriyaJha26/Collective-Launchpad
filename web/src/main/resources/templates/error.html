<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" th:dir="${#locale.language == 'ur'} ? 'rtl' : 'ltr'">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${status == 404} ? #{error.notFoundTitle} : #{error.title}">Error</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="wrap center mt">
  <h1 class="mt" th:text="${status == 404} ? #{error.notFound} : #{error.wrong}">Error</h1>
  <p class="muted" th:if="${status == 404}" th:text="#{error.404}">This shop or page does not exist.</p>
  <p class="muted" th:if="${status == 413}" th:text="#{error.413}">The photos are too large.</p>
  <p class="muted" th:if="${status == 403}" th:text="#{error.403}">This action was refused.</p>
  <p class="muted" th:if="${status != 404 and status != 413 and status != 403}" th:text="#{error.other}">Please try again in a moment.</p>
</main>
</body>
</html>
