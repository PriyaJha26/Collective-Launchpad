join.title=ਸਾਡੇ ਨਾਲ ਵੇਚੋ
join.intro=ਆਪਣੇ ਬਾਰੇ ਅਤੇ ਤੁਸੀਂ ਕੀ ਬਣਾਉਂਦੇ ਹੋ, ਥੋੜ੍ਹਾ ਦੱਸੋ। ਸਮੂਹ ਵਿੱਚੋਂ ਕੋਈ ਤੁਹਾਨੂੰ ਫ਼ੋਨ ਜਾਂ ਮੈਸੇਜ ਕਰਕੇ ਤੁਹਾਡੀ ਦੁਕਾਨ ਦਾ ਪੰਨਾ ਬਣਾਉਣ ਵਿੱਚ ਮਦਦ ਕਰੇਗਾ। ਪੁੱਛਣਾ ਮੁਫ਼ਤ ਹੈ, ਸਿਰਫ਼ ਫ਼ੋਨ ਕਾਫ਼ੀ ਹੈ।
