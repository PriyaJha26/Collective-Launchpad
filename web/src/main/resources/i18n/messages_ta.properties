# தமிழ்
lang.label=மொழி
join.title=எங்களுடன் விற்பனை செய்யுங்கள்
join.intro=உங்களைப் பற்றியும் நீங்கள் என்ன செய்கிறீர்கள் என்பதையும் சுருக்கமாகச் சொல்லுங்கள். குழுவிலிருந்து ஒருவர் உங்களை அழைத்தோ செய்தி அனுப்பியோ உங்கள் கடைப் பக்கத்தை அமைக்க உதவுவார். கேட்பது இலவசம், ஒரு போன் போதும்.
join.self=போனைப் பயன்படுத்தத் தெரியுமா? உங்கள் கடையை நீங்களே உருவாக்கலாம்.
join.selfLink=விற்பனையாளராகப் பதிவு செய்யுங்கள்
join.sent=நன்றி! உங்கள் கோரிக்கை கிடைத்தது. விரைவில் உங்களைத் தொடர்பு கொள்வோம்.
join.submit=என் கோரிக்கையை அனுப்பு
join.questions=கேள்விகள் உள்ளதா?
join.contact=எங்களைத் தொடர்பு கொள்ளுங்கள்
