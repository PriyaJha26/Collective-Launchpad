reg.loggedIn=நீங்கள் உள்நுழைந்துள்ளீர்கள். உங்கள் கடை இந்தக் கணக்கில் சேர்க்கப்படும்.
reg.help=உதவி வேண்டுமா? குழுவிடம் கேளுங்கள், அவர்கள் உங்களுக்காக அமைப்பார்கள்.
