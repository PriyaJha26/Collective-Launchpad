<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(#{nav.products} + ' · ' + ${group.name})}"></head>
<body>
<header th:replace="~{fragments :: topBar}"></header>
<div class="wrap shop-layout">
<aside th:replace="~{fragments :: productFilters}"></aside>
<main>
  <th:block th:replace="~{fragments :: flash}"></th:block>
  <div class="row between">
    <h1 class="mt" th:text="#{products.title}">All products</h1>
    <p class="muted small" th:if="${!products.isEmpty()}" th:text="#{products.count(${products.size()})}"></p>
  </div>
  <p class="muted" th:if="${products.isEmpty()}" th:text="#{products.none}">No products found.</p>
  <div class="products">
    <article class="product" th:each="p : ${products}">
      <a class="photo" th:href="@{/p/{id}(id=${p.id})}">
        <img th:if="${p.imageUrl() != null}" th:src="${p.imageUrl()}" th:alt="${p.name}" loading="lazy">
        <span th:unless="${p.imageUrl() != null}" aria-hidden="true">✿</span>
      </a>
      <div class="body">
        <h3><a th:href="@{/p/{id}(id=${p.id})}" th:text="${p.name}">Product</a></h3>
        <div class="small muted" th:text="${shopsById[p.sellerId].shopName}"></div>
        <div class="price"><span th:replace="~{fragments :: price(${p})}"></span> <span class="unit" th:if="${p.pricePaise != null}" th:text="${p.unit}"></span></div>
        <div class="small muted"><span th:replace="~{fragments :: stock(${p})}"></span></div>
        <a class="btn small ask" th:href="@{/p/{id}(id=${p.id})}" th:text="${p.canBeOrdered()} ? #{products.viewBuy} : #{products.view}">View</a>
      </div>
    </article>
  </div>
</main>
</div>
</body>
</html>
