name: Deploy

# On every push to main, SSH into the GoDaddy server, pull the code and rebuild the containers.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SERVER_HOST      e.g. 72.167.150.242
#   SERVER_USER      SSH user on the server
#   SERVER_SSH_KEY   private key whose public half is in ~/.ssh/authorized_keys on the server
#   SERVER_PORT      optional, defaults to 22
#   APP_DIR          optional, defaults to $HOME/Collective-Launchpad

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            cd "${{ secrets.APP_DIR || '$HOME/Collective-Launchpad' }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose ps
