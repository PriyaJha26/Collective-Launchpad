server:
  port: ${PORT:8080}
  forward-headers-strategy: framework     # trust X-Forwarded-* from Caddy (only Caddy can reach this port)
  servlet:
    session:
      tracking-modes: cookie
      timeout: 8h
      cookie:
        name: LAUNCHPAD_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}    # true in production (HTTPS)
        same-site: lax
        # No "domain" attribute: the cookie is host-only, so shop subdomains never receive it.

spring:
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/launchpad}
    username: ${DB_USER:launchpad}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
  servlet.multipart:
    max-file-size: 10MB
    max-request-size: 90MB
  thymeleaf.cache: ${THYMELEAF_CACHE:true}
  # Outgoing email from the group mailbox. Leave SMTP_HOST blank to simulate.
  # Titan (GoDaddy email): smtp.titan.email, port 465, SSL. If the login is rejected, try smtpout.secureserver.net.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties.mail.smtp:
      auth: true
      ssl.enable: ${SMTP_SSL:true}
      connectiontimeout: 10000
      timeout: 15000
      writetimeout: 15000

launchpad:
  site:
    domain: ${DOMAIN:localhost}
    scheme: ${PUBLIC_SCHEME:http}
    port: ${PUBLIC_PORT:8080}
  uploads-dir: ${UPLOADS_DIR:./data/uploads}
  internal-token: ${INTERNAL_TOKEN:}
  agent-url: ${AGENT_URL:http://localhost:8000}
  mail-from: ${MAIL_FROM:hello@localhost}
  seed:
    group-name: ${GROUP_NAME:Our Village Crafts}
    group-tagline: ${GROUP_TAGLINE:Handmade by the women of our village}
    group-description: ${GROUP_DESCRIPTION:}
    group-location: ${GROUP_LOCATION:}
    admin-email: ${ADMIN_EMAIL:admin@localhost}
    admin-password: ${ADMIN_PASSWORD:}
    sample-shop: ${SEED_SAMPLE_SHOP:false}
  costs:
    domain-per-year: ${COST_DOMAIN_YEAR:999}
    email-per-month: ${COST_EMAIL_MONTH:150}
    hosting-per-month: ${COST_HOSTING_MONTH:400}

logging.level:
  org.hibernate.SQL: warn
