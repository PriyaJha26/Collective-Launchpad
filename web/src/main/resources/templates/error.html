<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${status == 404} ? 'Not found' : 'Error'">Error</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="wrap center mt">
  <h1 class="mt" th:text="${status == 404} ? 'Page not found' : 'Something went wrong'">Error</h1>
  <p class="muted" th:if="${status == 404}">This shop or page does not exist.</p>
  <p class="muted" th:if="${status == 413}">The photos are too large. Please choose fewer or smaller photos.</p>
  <p class="muted" th:if="${status == 403}">This action was refused. Reload the page and try again.</p>
  <p class="muted" th:if="${status != 404 and status != 413 and status != 403}">Please try again in a moment.</p>
</main>
</body>
</html>
