join.title=ഞങ്ങളോടൊപ്പം വിൽക്കൂ
join.intro=നിങ്ങളെക്കുറിച്ചും നിങ്ങൾ എന്താണ് ഉണ്ടാക്കുന്നതെന്നും കുറച്ച് പറയൂ. ഗ്രൂപ്പിൽ നിന്ന് ആരെങ്കിലും നിങ്ങളെ വിളിക്കുകയോ മെസേജ് അയക്കുകയോ ചെയ്ത് നിങ്ങളുടെ കടയുടെ പേജ് ഉണ്ടാക്കാൻ സഹായിക്കും. ചോദിക്കുന്നത് സൗജന്യമാണ്, ഒരു ഫോൺ മതി.
join.self=ഫോൺ ഉപയോഗിക്കാൻ അറിയാമോ? നിങ്ങളുടെ കട നിങ്ങൾക്ക് തന്നെ ഉണ്ടാക്കാം.
